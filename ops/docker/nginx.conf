server {
    listen 8080;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This bundled web proxy has no OIDC integration. Never forward identity
        # headers supplied by an untrusted browser. A hospital-approved identity
        # gateway must authenticate the user and sign the headers at the API boundary.
        proxy_set_header X-Voxura-User "";
        proxy_set_header X-Voxura-Role "";
        proxy_set_header X-Voxura-Institution "";
        proxy_set_header X-Voxura-Timestamp "";
        proxy_set_header X-Voxura-Signature "";
        proxy_request_buffering off;
        client_max_body_size 512m;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
